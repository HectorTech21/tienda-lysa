<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#4B2A21">
  <meta name="robots" content="noindex">
  <title>Página no encontrada | Tienda Lysa</title>
  <meta name="description" content="La página que buscas no existe. Vuelve al inicio de Tienda Lysa para descubrir bolsos, mochilas, maletas y complementos.">
  <!-- Rutas desde la raíz: el servidor muestra esta página en cualquier dirección que no exista. -->
  <link rel="icon" href="/assets/logo.jpg" type="image/jpeg">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
  <link rel="stylesheet" href="/styles.css">
  <style>
    .not-found {
      min-height:100dvh;
      display:grid;
      place-items:center;
      padding:48px var(--gutter);
      text-align:center
    }
    .not-found img {
      width:96px;
      height:96px;
      border-radius:50%;
      margin:0 auto 28px
    }
    .not-found h1 {
      font-size:clamp(40px,6vw,72px);
      line-height:1.05;
      letter-spacing:-.03em;
      margin:14px 0 18px
    }
    .not-found h1 em {
      color:#885d51
    }
    .not-found p:not(.eyebrow) {
      max-width:420px;
      margin:0 auto 28px;
      color:var(--muted)
    }
    .not-found-actions {
      display:flex;
      flex-wrap:wrap;
      justify-content:center;
      align-items:center;
      gap:14px 26px
    }
    .not-found-legal {
      display:flex;
      flex-wrap:wrap;
      justify-content:center;
      gap:0 24px;
      margin-top:34px;
      font-size:12px;
      color:var(--muted)
    }
    .not-found-legal a {
      display:inline-flex;
      align-items:center;
      min-height:var(--tap)
    }
    .not-found-legal a:hover {
      text-decoration:underline;
      text-underline-offset:4px
    }
  </style>
</head>
<body>
  <main class="not-found">
    <div>
      <a href="/" aria-label="Tienda Lysa, inicio"><img src="/assets/logo.jpg" width="150" height="150" alt="Tienda Lysa"></a>
      <p class="eyebrow">ERROR 404</p>
      <h1>Esta página se ha <em>perdido.</em></h1>
      <p>La dirección que buscas no existe o ha cambiado. Vuelve al inicio y sigue descubriendo nuestra selección.</p>
      <div class="not-found-actions">
        <a class="button button-dark" href="/">Volver al inicio <span aria-hidden="true">↗</span></a>
        <a class="text-link" href="/#seleccion">Ver los productos <span aria-hidden="true">→</span></a>
      </div>
      <nav class="not-found-legal" aria-label="Textos legales"><a href="/aviso-legal">Aviso legal</a><a href="/privacidad">Privacidad</a><a href="/cookies">Cookies</a></nav>
    </div>
  </main>
</body>
</html>
