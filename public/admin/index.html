<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#4B2A21">
  <title>Panel · Tienda Lysa</title>
  <link rel="icon" href="/assets/logo.jpg">
  <link rel="stylesheet" href="/admin/admin.css">
  <script src="/admin/admin.js" defer></script>
</head>
<body>
  <header class="barra">
    <img src="/assets/logo.jpg" alt="" width="40" height="40">
    <p class="barra-titulo">Panel <span class="barra-titulo-resto">de Tienda Lysa</span></p>
    <nav class="barra-enlaces" aria-label="Accesos">
      <a class="barra-enlace" href="/" target="_blank" rel="noopener">Ver la tienda</a>
      <a class="barra-enlace" href="/cdn-cgi/access/logout" id="cerrar-sesion">Cerrar sesión</a>
    </nav>
    <!-- Los avisos cuelgan de la cabecera: siempre a la vista y sin tapar la barra de Guardar. -->
    <div class="avisos" id="avisos" aria-live="polite"></div>
  </header>

  <main id="contenido">
    <noscript><p class="aviso-fijo">El panel necesita JavaScript para funcionar.</p></noscript>

    <!-- Listado -->
    <section id="vista-lista" aria-labelledby="titulo-lista">
      <div class="cabecera-lista">
        <h1 id="titulo-lista">Productos</h1>
        <button type="button" class="boton primario" id="boton-nuevo">+ Añadir producto</button>
      </div>
      <div class="filtros">
        <label class="campo">
          <span class="etiqueta">Buscar</span>
          <input type="search" id="buscar" placeholder="Nombre, marca o referencia" autocomplete="off" enterkeyhint="search">
        </label>
        <label class="campo">
          <span class="etiqueta">Categoría</span>
          <select id="filtro-categoria"></select>
        </label>
        <label class="campo">
          <span class="etiqueta">Mostrar</span>
          <select id="filtro-estado">
            <option value="">Todos</option>
            <option value="visibles">Visibles</option>
            <option value="ocultos">Ocultos</option>
          </select>
        </label>
      </div>
      <p class="recuento" id="recuento" role="status"></p>
      <ul class="lista" id="lista"></ul>
      <div class="vacio" id="lista-vacia" hidden>
        <p id="lista-vacia-texto"></p>
        <button type="button" class="boton" id="limpiar-filtros">Ver todos los productos</button>
      </div>
    </section>

    <!-- Crear y editar -->
    <section id="vista-formulario" aria-labelledby="titulo-formulario" hidden>
      <button type="button" class="volver" id="boton-volver">← Volver a los productos</button>
      <h1 id="titulo-formulario" tabindex="-1">Nuevo producto</h1>
      <p class="referencia" id="referencia-producto" hidden></p>

      <form id="formulario" novalidate>
        <fieldset class="bloque">
          <legend>Fotos</legend>
          <p class="ayuda">La primera foto es la principal: la que se ve en la tienda.</p>
          <ul class="fotos" id="fotos"></ul>
          <p class="error-campo" id="error-fotos" hidden></p>
          <div class="botones-fotos">
            <label class="boton">
              <input type="file" id="elegir-fotos" accept="image/*" multiple class="oculto-visual">
              Elegir de la galería
            </label>
            <label class="boton">
              <input type="file" id="hacer-foto" accept="image/*" capture="environment" class="oculto-visual">
              Hacer una foto
            </label>
          </div>
          <p class="ayuda" id="estado-fotos" role="status"></p>
        </fieldset>

        <fieldset class="bloque">
          <legend>Datos del producto</legend>
          <label class="campo">
            <span class="etiqueta">Nombre del producto <small class="obligatorio">(obligatorio)</small></span>
            <input type="text" id="titulo" maxlength="120" autocomplete="off" required aria-required="true">
            <span class="error-campo" id="error-titulo" hidden></span>
          </label>
          <label class="campo">
            <span class="etiqueta">Categoría <small class="obligatorio">(obligatorio)</small></span>
            <select id="categoria" required aria-required="true"></select>
            <span class="error-campo" id="error-categoria" hidden></span>
          </label>
          <label class="campo">
            <span class="etiqueta">Marca <small>(opcional)</small></span>
            <select id="marca"></select>
          </label>
          <label class="campo" id="campo-marca-otra" hidden>
            <span class="etiqueta">Nombre de la marca</span>
            <input type="text" id="marca-otra" maxlength="60" autocomplete="off">
            <span class="error-campo" id="error-marca" hidden></span>
          </label>
          <label class="campo">
            <span class="etiqueta">Precio en euros <small>(opcional)</small></span>
            <input type="text" id="precio" inputmode="decimal" maxlength="9" placeholder="Por ejemplo 39,90" autocomplete="off">
            <span class="ayuda">Puedes escribirlo con coma o con punto. Si lo dejas vacío, en la tienda aparece «Consultar precio».</span>
            <span class="error-campo" id="error-precio" hidden></span>
          </label>
          <label class="campo">
            <span class="etiqueta">Color <small>(opcional)</small></span>
            <input type="text" id="color" maxlength="60" autocomplete="off">
            <span class="error-campo" id="error-color" hidden></span>
          </label>
          <label class="campo">
            <span class="etiqueta">Descripción <small>(opcional)</small></span>
            <textarea id="descripcion" rows="4" maxlength="1000"></textarea>
            <span class="error-campo" id="error-descripcion" hidden></span>
          </label>
        </fieldset>

        <fieldset class="bloque">
          <legend>En la tienda</legend>
          <label class="casilla">
            <input type="checkbox" id="visible" checked>
            <span><strong>Visible en la tienda</strong><br><span class="ayuda">Desmárcalo para guardarlo sin que lo vean los clientes.</span></span>
          </label>
          <label class="casilla">
            <input type="checkbox" id="destacado">
            <span><strong>Destacado</strong><br><span class="ayuda">Los productos destacados salen los primeros.</span></span>
          </label>
        </fieldset>

        <div class="barra-guardar">
          <div class="progreso" id="progreso" hidden>
            <p id="progreso-texto" role="status"></p>
            <progress id="progreso-barra" max="100" value="0"></progress>
          </div>
          <div class="barra-guardar-botones">
            <button type="button" class="boton" id="boton-cancelar">Cancelar</button>
            <button type="submit" class="boton primario" id="boton-guardar">Guardar</button>
          </div>
        </div>
      </form>

      <div class="zona-borrar" id="zona-borrar" hidden>
        <button type="button" class="boton peligro" id="boton-borrar">Borrar este producto</button>
      </div>
    </section>
  </main>

  <dialog id="dialogo" aria-labelledby="dialogo-titulo">
    <h2 id="dialogo-titulo"></h2>
    <p id="dialogo-texto"></p>
    <div class="dialogo-botones">
      <button type="button" class="boton" id="dialogo-cancelar">Cancelar</button>
      <button type="button" class="boton peligro" id="dialogo-aceptar"></button>
    </div>
  </dialog>
</body>
</html>
